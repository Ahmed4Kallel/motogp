<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - MotoGp Nabeul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/extra.css"/>
</head>
<body>

<div class="auth-page">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1610478920409-ec0f58e881a5?w=1200&q=85" alt="Motorcycle" class="auth-visual-img"/>
    <div class="auth-visual-overlay"></div>
    <div class="auth-visual-content">
      <h2>Welcome back</h2>
      <p>Continue your journey through Nabeul.</p>
    </div>
  </div>

  <div class="auth-card-wrapper">
    <div class="auth-card">
      <a href="index.html" class="nav-logo" style="display:block;text-align:center;margin-bottom:32px;">Moto<span>Gp</span></a>
      <h2>Sign In</h2>
      <p class="auth-subtitle">Enter your credentials to access your account</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-input" placeholder="your@email.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-input" placeholder="Your password" required/>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-muted);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--primary);width:16px;height:16px;"/> Remember me
          </label>
          <a href="#" style="font-size:0.85rem;color:var(--primary);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">Sign In</button>
      </form>

      <div class="form-divider"><span>or</span></div>

      <div class="social-login">
        <button class="btn btn-outline" style="flex:1;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn btn-outline" style="flex:1;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/></svg>
          Facebook
        </button>
      </div>

      <p class="auth-link">Don't have an account? <a href="register.html">Sign Up</a></p>
      <div style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
        <p style="font-size:0.78rem;color:var(--text-muted);">Admin: admin@motogp.tn / admin123</p>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
